name: AllStocks Sheet Sync (manual mirror from git-files)

# Mirrors the COMPLETE git-file gz-CSV archive (docs/data/_allstocks/) into the
# month's Google Sheet via --sync-from-files. The daily.yml pipeline already does
# this on schedule; this workflow is a manual/ad-hoc re-mirror (e.g. to backfill a
# Sheet after the local TW-IP task lands TWSE/TDCC data, or to verify the path).
# Reads what is currently committed in the repo — run it AFTER the day's archive
# (CI git-file step + the local 14:45 TW task) has pushed.
#
# 2026-07-17 (audit follow-up): `dates` now accepts a comma/space-separated LIST for
# historical backfill (one --sync-from-files pass per date), plus an optional single
# `source` tab filter. A tab=-1 in any pass fails the run (sentinel grep) so a
# backfill that silently skips a tab can't look green.
on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Date(s) to mirror: YYYY-MM-DD, comma/space-separated list; empty = today UTC'
        required: false
        default: ''
      source:
        description: 'Optional single tab filter (e.g. sec_ftd_semimonthly); empty = all 13 tabs'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: allstocks-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        # Prefer the CI-frozen lock (reproducible) when present; fall back to the floating
        # requirements.txt until freeze-lock.yml has committed requirements.lock.
        run: |
          if [ -f requirements.lock ]; then pip install -r requirements.lock; else pip install -r requirements.txt; fi
      - name: Mirror git-file archive into the month Sheet(s)
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          DATES: ${{ github.event.inputs.dates }}
          SRC: ${{ github.event.inputs.source }}
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/sync.log"
          SRC_ARG=""
          if [ -n "$SRC" ]; then SRC_ARG="--source $SRC"; fi
          if [ -z "$DATES" ]; then
            python sheets_sync_allstocks.py --sync-from-files $SRC_ARG 2>&1 | tee -a "$LOG"
          else
            for D in $(echo "$DATES" | tr ',' ' '); do
              echo "== mirror $D =="
              python sheets_sync_allstocks.py --sync-from-files --date "$D" $SRC_ARG 2>&1 | tee -a "$LOG"
            done
          fi
          # Sentinel: any tab counted -1 in any pass = a real per-tab failure → fail
          # the run so the backfill operator sees red instead of a silent skip.
          # (Pattern anchored to the counts dict "': -1" so dates like 07-16 don't match.)
          if grep -E "': -1[,}]" "$LOG"; then
            echo "::error::>=1 tab reported -1 during the mirror (matched lines above)"
            exit 1
          fi
          echo "::notice::all mirror passes completed with no tab=-1"
