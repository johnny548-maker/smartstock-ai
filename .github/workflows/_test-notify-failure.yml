name: TEST notify-failure (throwaway)

# Throwaway E2E test of the keyless failure-alert wiring. Deliberately fails so the
# notify-failure job (same logic as the real workflows) opens a GitHub issue AS
# github-actions[bot] — which notifies the repo owner (you can't be notified of issues
# you open yourself). Delete this file once notification receipt is confirmed.
on:
  workflow_dispatch: {}

jobs:
  notify-failure:
    needs: [fail-on-purpose]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="Workflow **${WF}** failed at $(date -u +%Y-%m-%dT%H:%MZ). Run: ${RUN_URL}"
          NUM=$(gh issue list --repo "$REPO" --state open --search "${WF} failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "🔴 ${WF} failed" --body "$BODY"
          fi

  fail-on-purpose:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "deliberate failure to exercise the notify-failure alert path"
          exit 1
