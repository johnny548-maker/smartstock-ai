name: Warm US 15y OHLCV cache (incremental)

# Option B: the full US market (~5.6k Nasdaq-Trader common stocks) cannot be 15y-fetched in one
# 350min CI job, so this warms the cache INCREMENTALLY — each run fetches the next slice of names
# that don't yet have a cache file (build_ohlcv_cache --uncached-only --limit) and persists them to
# the SHARED rolling actions/cache (same key prefix as optimize-sleeve.yml). After ~5-6 runs the US
# universe is covered; from then on the slice is empty and the job is a cheap no-op.
#
# STOP CONDITION: when coverage hits ~100% the uncached slice is empty → build_cache fetches nothing
# (fast no-op). Once the run log shows coverage[US] 100%, disable this schedule (it self-throttles
# to a cheap no-op but there's no reason to keep paying ~3min/run). The cache the optimiser reads is
# the side effect; nothing is committed to the repo.
on:
  workflow_dispatch:
    inputs:
      slice:
        description: 'how many uncached US names to fetch this run (bounded so it fits the timeout)'
        default: '1000'
      tw_top_n:
        description: 'TW liquidity cap passed to build_universe (kept consistent with the optimiser)'
        default: '800'
  schedule:
    # every 5 days at 03:23 UTC. The US universe is already ~99% warm, so this is NO LONGER a
    # filler — it is a low-frequency KEEP-ALIVE that refreshes the ohlcv15y cache's last_accessed
    # inside GitHub's 7-day eviction window (a 5-day cadence always touches it before day-7 expiry).
    - cron: '23 3 */5 * *'

permissions:
  contents: read
  actions: write        # the cache-prune step DELETEs superseded ohlcv15y caches via the REST API

concurrency:
  group: smartstock-ohlcv-cache    # never two cache writers at once
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 340           # < the 350 cap; a ~1000-name slice fetches well inside this
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          if [ -f requirements.lock ]; then pip install -r requirements.lock; else pip install -r requirements.txt; fi

      # WEEK-STAMPED key (was ${{ github.run_id }} = a NEW 351MB cache EVERY run → 9.67GB bloat).
      # A weekly key (ISO year-week) makes same-week re-runs an EXACT hit that saves NOTHING, so the
      # cache grows by at most one 351MB entry per week; the prune step below then keeps only the
      # newest. restore-keys prefix-match still restores the latest cache regardless of week.
      - name: Compute weekly cache key
        run: echo "WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      # Share the SAME rolling cache as optimize-sleeve.yml so warmed names are visible to the
      # optimiser. restore-keys prefix-match restores the latest even across week boundaries.
      - name: Restore 15y OHLCV cache
        uses: actions/cache@v4
        with:
          path: .cache/ohlcv_15y
          key: smartstock-ohlcv15y-${{ env.WEEK }}
          restore-keys: |
            smartstock-ohlcv15y-

      # Use the committed PINNED universe by default so the warmer fetches exactly the US names the
      # optimiser will read (only regenerate if the file is missing from the checkout).
      - name: Ensure full-market universe present
        env:
          TW_TOP_N: ${{ github.event.inputs.tw_top_n || '800' }}
        run: |
          set -euo pipefail
          if [ ! -f universe_full_market.csv ]; then
            python -X utf8 build_universe.py --out universe_full_market.csv --tw-top-n "${TW_TOP_N}"
          else
            echo "using PINNED universe_full_market.csv ($(wc -l < universe_full_market.csv) rows)"
          fi

      - name: Warm the next US slice
        env:
          SLICE: ${{ github.event.inputs.slice || '1000' }}
        run: |
          set -euo pipefail
          # --skip-file excludes the ~40 permanently-dead US names (delisted shells / -W warrants
          # Yahoo has no 15y history for) so the warmer stops re-attempting them every run.
          python -X utf8 build_ohlcv_cache.py \
            --csv universe_full_market.csv --market US --uncached-only --limit "${SLICE}" \
            --skip-file data/us_fetch_skiplist.txt

      # Keep the shared cache lean: the DELETE endpoint is EXACT-KEY, so enumerate every
      # smartstock-ohlcv15y-* cache, keep only the most-recent, and delete the rest one by one.
      # ONLY the ohlcv15y prefix is touched — panel/aux/setup-python caches are never listed here.
      - name: Prune superseded ohlcv15y caches (keep newest 1)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t KEYS < <(gh api "repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches | sort_by(.created_at) | reverse
                  | map(select(.key | startswith("smartstock-ohlcv15y-"))) | .[].key')
          echo "found ${#KEYS[@]} ohlcv15y cache key(s)"
          if [ "${#KEYS[@]}" -gt 1 ]; then
            for k in "${KEYS[@]:1}"; do
              echo "deleting superseded cache: $k"
              gh api -X DELETE "repos/${REPO}/actions/caches?key=$k" \
                || echo "delete failed (non-fatal): $k"
            done
          else
            echo "nothing to prune"
          fi
