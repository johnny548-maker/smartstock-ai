name: SmartStock Daily

# Runs in the cloud — your computer can stay off.
on:
  schedule:
    # GitHub free-tier scheduled runs are best-effort: they fire ~3h late under load and are
    # sometimes DROPPED entirely (observed 2026-06-08: 06-04/06-05 fired ~3h late, 06-08 dropped).
    # Mitigation = two ticks at odd minutes (avoid the contended :00/:30) so a dropped primary is
    # caught by the backup. The skip-if-exists guard below makes the backup a no-op on normal days.
    # Times are TW close + T86 (三大法人) aware.
    - cron: '27 10 * * 1-5'   # primary  ~18:27 TW (10:27 UTC)
    - cron: '13 12 * * 1-5'   # backup   ~20:13 TW (12:13 UTC) — only generates if primary was dropped
  workflow_dispatch: {}   # manual run from the Actions tab — ALWAYS regenerates (bypasses skip guard)

permissions:
  contents: write          # to commit the new report JSON back to the repo

concurrency:
  group: smartstock-daily
  cancel-in-progress: false

jobs:
  # Keyless failure alert: on a HARD job failure (not a graceful per-source skip), open OR
  # comment ONE open GitHub issue per distinct error fingerprint using the built-in
  # GITHUB_TOKEN — no external service, no secret. GitHub then notifies via email + mobile app.
  #
  # Audit #9 fix: title includes SHA-256(last 10 log lines)[:8] so each distinct root cause
  # gets its own issue. Previously "${WF} failed" was too broad — 6 unrelated errors glued
  # to one issue, and the alert became noise. Now each unique failure signature is tracked
  # separately. If an issue already has >=3 comments (busy thread), a NEW issue is created
  # with a variant suffix to avoid burying fresh context.
  notify-failure:
    needs: [build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a fingerprinted failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Compute error fingerprint from the last 10 lines of the failed step log.
          # sha256sum outputs "<hash>  -"; we take the first 8 hex chars.
          LOG_TAIL=$(gh run view "${{ github.run_id }}" --log-failed --repo "$REPO" 2>/dev/null | tail -10 || true)
          FP=$(printf '%s' "$LOG_TAIL" | sha256sum | head -c 8)

          NEW_TITLE="🔴 ${WF} failed (${FP})"
          BODY="Workflow **${WF}** failed at $(date -u +%Y-%m-%dT%H:%MZ).\nFingerprint: \`${FP}\` (SHA-256 of last 10 log lines).\nRun: ${RUN_URL}"

          NUM=$(gh issue list --repo "$REPO" --state open \
            --search "${NEW_TITLE} in:title" --json number --jq '.[0].number // empty')

          if [ -n "$NUM" ]; then
            # If the existing issue thread is crowded (>=3 comments), open a fresh one
            # to avoid burying new context in a long thread.
            COMMENT_COUNT=$(gh issue view "$NUM" --repo "$REPO" --json comments \
              --jq '.comments | length')
            if [ "${COMMENT_COUNT:-0}" -ge 3 ]; then
              # Append run-id suffix to make title unique for this new occurrence.
              OVERFLOW_TITLE="${NEW_TITLE} [run ${{ github.run_id }}]"
              gh issue create --repo "$REPO" --title "$OVERFLOW_TITLE" --body "$BODY"
            else
              gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
            fi
          else
            gh issue create --repo "$REPO" --title "$NEW_TITLE" --body "$BODY"
          fi

  # P1 item4: data-staleness HARD alert. The build job exits 0 even when data is STALE
  # (graceful per-source SKIP). This job reads the freshly-committed report's health.overall
  # and, ONLY when 'stale', opens/updates a deduped GitHub issue (+ optional email). stale-only
  # by design — 'degraded' is logged but not alerted, to avoid alert fatigue.
  notify-stale:
    needs: [build]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Pull the build job's freshly-committed report
        run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - name: Alert if today's report is STALE
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          F="docs/data/$DATE.json"
          if [ ! -f "$F" ]; then echo "::notice::no report for $DATE — skip stale check"; exit 0; fi
          OVERALL=$(jq -r '.health.overall // "unknown"' "$F")
          echo "health.overall=$OVERALL"
          if [ "$OVERALL" != "stale" ]; then echo "not stale — no alert"; exit 0; fi
          TITLE="🔴 SmartStock 資料停滯 (stale)"
          BODY="Daily report health=**stale** for ${DATE}. Data has not refreshed (生成時間過舊 / OHLCV 落後 / 來源大量失效). Run: ${RUN_URL}"
          NUM=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
          # Optional email (no-op if secrets unset — notifier_email degrades gracefully).
          python -c "import notifier_email; notifier_email.send_email('🔴 SmartStock 資料停滯警報', '今日報告 health=stale，資料未刷新，請查 GitHub Actions。')" || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Idempotency guard: a backup scheduled run should NOT regenerate when the primary already
      # produced today's report. Manual (workflow_dispatch) runs always proceed so you can force a
      # rebuild. Date basis matches main.py's datetime.now() (UTC on the runner) + the commit's
      # `date -u +%F`, so docs/data/<UTC-date>.json is the correct existence check.
      - name: Skip duplicate scheduled run
        id: report_check
        run: |
          DATE=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/data/$DATE.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Report for $DATE already present — scheduled backup run is a no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.report_check.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        if: steps.report_check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # P2-S1: read-back the user's holdings ledger from the Google Sheet 'my_positions' tab
      # into docs/data/_positions_state.json BEFORE the analysis run, so main.py can evaluate
      # held positions this run. best-effort: continue-on-error + the script is a graceful
      # no-op when GOOGLE_SA_JSON is unset, so the REPORT is always primary (never blocked by
      # the optional positions read-back).
      - name: Pull positions ledger from Google Sheet
        if: steps.report_check.outputs.skip != 'true'
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEETS_ID: 1-pZRldRcTglT8rkBiQAnRdDigu4KnHdcT2WF-WfxmVM
        run: python sheets_sync.py --pull-positions

      # #3: restore the keyless all-market OHLC panel (gitignored, reconstructable) so the daily
      # run appends one more snapshot + scores names with enough history into the verdict map.
      # Rolling key (unique per run + prefix restore-keys) → restore the latest, save a new one.
      - name: Restore market panel cache
        if: steps.report_check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: docs/data/_panel.json.gz
          key: smartstock-panel-${{ github.run_id }}
          restore-keys: |
            smartstock-panel-

      - name: Run analysis + export PWA data
        if: steps.report_check.outputs.skip != 'true'
        env:
          # Optional — set these as repo Secrets to also receive the report by email.
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py --web

      # Mirror today's report into the Google Sheet backend (JSON in git stays source-of-truth).
      # best-effort: continue-on-error + the script is a graceful no-op when GOOGLE_SA_JSON is
      # unset, so the report pipeline never breaks because of the (secondary) Sheet mirror.
      - name: Mirror to Google Sheet backend
        if: steps.report_check.outputs.skip != 'true'
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEETS_ID: 1-pZRldRcTglT8rkBiQAnRdDigu4KnHdcT2WF-WfxmVM
        run: python sheets_sync.py

      # P1 item9: PWA payload smoke test — fail the run BEFORE committing a broken deploy.
      # Validates the freshly-written payload is non-empty + well-formed (picks present,
      # verdict map non-empty, health block present). Catches a silently-broken export.
      - name: Smoke-test PWA payload
        if: steps.report_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          F="docs/data/$DATE.json"
          test -f "$F" || { echo "::error::no payload $F"; exit 1; }
          N_PICKS=$(jq '.picks | length' "$F")
          HAS_HEALTH=$(jq 'has("health")' "$F")
          test "$N_PICKS" -ge 1 || { echo "::error::payload has 0 picks"; exit 1; }
          test "$HAS_HEALTH" = "true" || { echo "::error::payload missing health block"; exit 1; }
          test -f docs/data/_verdicts.json || { echo "::error::missing _verdicts.json"; exit 1; }
          N_V=$(jq 'length' docs/data/_verdicts.json)
          test "$N_V" -ge 1 || { echo "::error::_verdicts.json empty"; exit 1; }
          # additive keys present (default {} is fine — only assert the key exists, never breaks picks)
          test "$(jq 'has("validated_portfolio")' "$F")" = "true" || { echo "::error::missing validated_portfolio key"; exit 1; }
          test "$(jq 'has("factor_validation")' "$F")" = "true" || { echo "::error::missing factor_validation key"; exit 1; }
          echo "::notice::smoke ok — picks=$N_PICKS verdicts=$N_V health=present validated_portfolio+factor_validation=present"

      - name: Commit report to docs/data
        if: steps.report_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          # || true is intentional: empty-commit case is not a failure for THIS step
          # (the push loop below is a no-op when there is nothing new to push).
          git commit -m "report: $(date -u +%F)" || echo "no changes to commit"
          # rebase-retry: a concurrent push (the index-rebuild job, a manual dispatch, or a
          # human commit) can move main between commit and push; without this the whole run
          # fails and the freshly-generated report is LOST. Rebase onto remote and retry.
          # Audit follow-up #6 (PR #21): all-5-fail path used to fall through silently and
          # the subsequent "Rebuild date index" step (if: always()) would push an index
          # referencing a report that doesn't exist on origin. Track success with PUSHED
          # flag and exit 1 explicitly so the rebuild step is gated off by `if: success()`.
          PUSHED=false
          for i in 1 2 3 4 5; do
            if git push; then
              PUSHED=true
              break
            fi
            echo "push rejected (race), rebase + retry $i/5"
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep 5
          done
          if [ "${PUSHED}" = "false" ]; then
            echo "::error::Commit report: push failed after 5 attempts. Today's report was NOT published to origin — refusing to silently proceed (would leave index/main divergence after rebuild step)."
            exit 1
          fi

      # All-stocks raw archive (~1800 stocks × 13 sources) → per-period gzip-CSV files committed
      # to git under docs/data/_allstocks/. OVERLAY-NOT-SCORER — pure archive, never feeds scoring.
      # Keyless: NO Google Sheets / NO Service Account / NO quota. This replaces the retired
      # month-shard Sheet (SA Drive quota=0 blocked headless monthly rollover — 2026-06-26).
      # continue-on-error: the archive is secondary and must never block the daily report.
      - name: Archive all-stocks snapshots to git files
        if: steps.report_check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          python sheets_sync_allstocks.py --archive-files --date $(date -u +%F)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/_allstocks
          if git diff --cached --quiet; then
            echo "::notice::no all-stocks archive changes"
          else
            git commit -m "archive(allstocks): $(date -u +%F)"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push race, rebase + retry $i/5"
              git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
              sleep 5
            done
          fi

      # Bug-fix: the date-picker index can go STALE if a branch MERGE clobbers index.json or a
      # scheduled run is skipped — leaving committed <date>.json reports invisible. Rebuild the
      # index from the actual report files EVERY run so the picker always lists exactly the
      # reports that exist. Self-heals a clobbered index without waiting for new data.
      #
      # Audit follow-up #6+#7 (PR #21): gate is now `if: success()` (was `if: always()`).
      # Rationale: if "Commit report" fails to push, rebuilding the date index now would
      # publish an index referencing a <date>.json that exists ONLY locally — causing the
      # picker to show a date the PWA can't load. The self-heal job runs on the NEXT
      # successful daily run anyway (index is always rebuilt from disk), so deferring is safe.
      - name: Rebuild date index (self-heal stale picker)
        if: success() && steps.report_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -c "import web_export, os; n=len(web_export._rebuild_index(os.path.join('docs','data'))); print('::notice::date index rebuilt with %d dates' % n)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/index.json
          # || true is intentional: empty-commit case is not a failure for THIS step
          # (the push loop below is a no-op when there is nothing new to push).
          git commit -m "chore: rebuild date index" || echo "index already current"
          # Audit follow-up #7 (PR #21): the previous `|| echo "nothing to push"` after the
          # loop swallowed a genuine all-retries-failed push error as a no-op. Track success
          # with a flag and exit-1 explicitly so the failure surfaces (notify-failure job
          # opens a fingerprinted issue rather than the run going green with a stale index).
          PUSHED=false
          for i in 1 2 3 4 5; do
            if git push; then
              PUSHED=true
              break
            fi
            echo "index push rejected (race), rebase + retry $i/5"
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep 5
          done
          if [ "${PUSHED}" = "false" ]; then
            # Distinguish nothing-to-push (HEAD matches origin) from real push failure.
            # `git status -uno` reports "Your branch is up to date" when the local commit
            # was either a no-op or already pushed by a concurrent job — both are benign.
            if git status -uno | grep -q "Your branch is up to date"; then
              echo "::notice::index already on origin (concurrent push or no-op commit) — treating as success"
            else
              echo "::error::Rebuild date index: push failed after 5 attempts. Index NOT published — picker may show stale dates until next successful run."
              exit 1
            fi
          fi
