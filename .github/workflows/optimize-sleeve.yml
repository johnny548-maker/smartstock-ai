name: SmartStock Optimize Sleeve

# #4: disciplined Calmar/Sharpe/DD optimisation of the momentum sleeve (vol-targeting grid +
# DSR/PBO gates). HEAVY 15y x ~650-name compute → runs in the cloud, NOT on a local machine.
# Manual (workflow_dispatch) + a monthly refresh. The 15y OHLCV cache is persisted via a rolling
# actions/cache so the first run pays the ~350min download once and later runs reuse it.
#
# CANONICAL vs SCOUT outputs (audit finding 1, 2026-07-17): on `schedule` the inputs context is
# EMPTY, so every `inputs.X || 'default'` falls back — 2026-07-07 the monthly tick ran
# universe=draft/combo=false and OVERWROTE the blessed full-universe optimize_tw/us.{json,txt}
# (gate FAIL became PASS, combo wiped to null). Now:
#   workflow_dispatch (human-blessed run)  → writes the canonical optimize_<sleeve>.{json,txt}
#   schedule (monthly scout, default args) → outputs renamed to optimize_<sleeve>_scout.{json,txt}
#     and the canonical files are restored from HEAD before commit — a scout NEVER overwrites
#     the canonical result; promote a scout by re-running the same config via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      sleeve:
        description: 'Which sleeve to optimise'
        type: choice
        options: [both, tw, us]
        default: both
      objective:
        description: 'Objective function'
        type: choice
        options: [calmar, sharpe, maxdd_capped]
        default: calmar
      maxdd_cap:
        description: 'MaxDD cap (only used when objective=maxdd_capped), e.g. 0.35'
        default: '0.35'
      universe:
        description: 'draft (653 names) or full (whole keyless market — HEAVY first cache build)'
        type: choice
        options: [draft, full]
        default: draft
      tw_top_n:
        description: 'when universe=full, cap TW to the N most liquid by dollar-vol (blank = all)'
        default: '800'
      rigorous:
        description: 'use the嚴謹 walk-forward OOS selection (true terminal lockbox + embargo)'
        type: boolean
        default: true
      rebuild_universe:
        description: 'regenerate universe_full_market.csv from LIVE liquidity (default false = use the
                      committed PINNED universe so results are reproducible run-to-run)'
        type: boolean
        default: false
      combo:
        description: 'also run the pre-registered multi-factor inverse-vol COMBO + gate (LOWVOL+STREV+MOM)'
        type: boolean
        default: false
  schedule:
    - cron: '43 6 7 * *'   # 7th of each month, 06:43 UTC — monthly re-optimise

permissions:
  contents: write
  issues: write

concurrency:
  # Joined to the OHLCV-cache writer group: the freshen step below WRITES the shared cache, so it
  # must be mutually exclusive with warm-us-cache (else a concurrent warmer would persist its
  # pre-freshen snapshot under a newer key and RESURRECT the stale files this run just deleted).
  group: smartstock-ohlcv-cache
  cancel-in-progress: false

jobs:
  notify-failure:
    needs: [optimize]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="Workflow **${WF}** failed at $(date -u +%Y-%m-%dT%H:%MZ). Run: ${RUN_URL}"
          NUM=$(gh issue list --repo "$REPO" --state open --search "${WF} failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "🔴 ${WF} failed" --body "$BODY"
          fi

  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          if [ -f requirements.lock ]; then pip install -r requirements.lock; else pip install -r requirements.txt; fi

      # Persist the 15y OHLCV cache across runs: first run downloads (~350min), later runs reuse.
      - name: Restore 15y OHLCV cache
        uses: actions/cache@v4
        with:
          path: .cache/ohlcv_15y
          key: smartstock-ohlcv15y-${{ github.run_id }}
          restore-keys: |
            smartstock-ohlcv15y-

      # Freshen a bounded slice of stale cache files BEFORE the backtest so a long-lived cache never
      # silently backtests frozen prices. --stale-refresh DELETEs files whose last bar is >~5 trading
      # days old → the miss path re-fetches the WHOLE history (NEVER a yfinance start=last+1 append,
      # which auto_adjust would level-shift). --limit bounds it to fit the 350min budget. This run
      # holds the smartstock-ohlcv-cache mutex, so no warmer can revive what it deletes.
      - name: Freshen stale OHLCV bars (delete + whole-history re-fetch)
        run: |
          set -euo pipefail
          CSV=universe_15y_draft.csv
          [ -f universe_full_market.csv ] && CSV=universe_full_market.csv
          python -X utf8 build_ohlcv_cache.py --stale-refresh 5 --limit 500 --csv "$CSV"

      # Phase 2: when universe=full, assemble the whole keyless market (TWSE+TPEx liquidity-capped
      # + the full US directory) into universe_full_market.csv. The 15y OHLC fetch for it is the
      # heavy part — names lacking long history are skipped by build_cache, so the effective
      # universe is "names with 15y history". draft = the curated 653-name CSV (default, fast).
      # PINNED by default: the committed universe_full_market.csv is reused so the backtest is
      # reproducible run-to-run (live liquidity ranking otherwise reshuffles the TW top-N → the
      # champion drifts). Only regenerate when rebuild_universe=true or the file is missing.
      - name: Assemble full-market universe (universe=full only)
        if: ${{ github.event.inputs.universe == 'full' }}
        env:
          TW_TOP_N: ${{ github.event.inputs.tw_top_n || '800' }}
          REBUILD: ${{ github.event.inputs.rebuild_universe }}
        run: |
          set -euo pipefail
          if [ "$REBUILD" = "true" ] || [ ! -f universe_full_market.csv ]; then
            ARGS=""
            if [ -n "${TW_TOP_N}" ]; then ARGS="--tw-top-n ${TW_TOP_N}"; fi
            python -X utf8 build_universe.py --out universe_full_market.csv $ARGS
          else
            echo "using PINNED universe_full_market.csv ($(wc -l < universe_full_market.csv) rows)"
          fi

      - name: Optimise sleeve(s)
        env:
          SLEEVE: ${{ github.event.inputs.sleeve || 'both' }}
          OBJ: ${{ github.event.inputs.objective || 'calmar' }}
          CAP: ${{ github.event.inputs.maxdd_cap || '0.35' }}
          UNIVERSE: ${{ github.event.inputs.universe || 'draft' }}
          # Finding B1-07 (2026-08-03): unlike SLEEVE/OBJ/CAP/UNIVERSE above, these two had NO
          # `|| 'default'` fallback — on `schedule` events github.event.inputs is EMPTY, so
          # RIGOROUS/COMBO resolved to "" which `!= "false"` evaluates true, silently forcing
          # `--rigorous --embargo 252` (burning the terminal lockbox) on every monthly schedule
          # run regardless of the (also-unset) combo flag. workflow_dispatch is unaffected —
          # GitHub always fills in the declared input defaults (rigorous: true, combo: false) for
          # that trigger — so this fallback only changes behavior on `schedule`.
          RIGOROUS: ${{ github.event.inputs.rigorous || 'false' }}
          COMBO: ${{ github.event.inputs.combo || 'false' }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$UNIVERSE" = "full" ]; then EXTRA="--csv universe_full_market.csv"; fi
          # workflow_dispatch defaults true (declared input default); schedule now defaults
          # 'false' via the env fallback above (B1-07 fix) — only an explicit 'false' disables
          # the嚴謹 path, and schedule is no longer ambient-true.
          if [ "$RIGOROUS" != "false" ]; then EXTRA="$EXTRA --rigorous --embargo 252"; fi
          if [ "$COMBO" = "true" ]; then EXTRA="$EXTRA --combo"; fi
          run_one () { python -X utf8 run_optimize.py --sleeve "$1" --objective "$OBJ" --maxdd-cap "$CAP" $EXTRA; }
          if [ "$SLEEVE" = "both" ]; then run_one tw; run_one us; else run_one "$SLEEVE"; fi

      # Audit finding 1: a scheduled (scout) run must NEVER clobber the canonical
      # (workflow_dispatch-blessed) optimize_<sleeve>.{json,txt}. run_optimize.py always
      # writes the canonical filenames in the workspace, so on schedule we (a) move the
      # fresh outputs to *_scout.* and (b) restore the canonical files from HEAD so the
      # commit step below only picks up the scout files.
      - name: Reroute scheduled outputs to scout files (never overwrite canonical)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          for f in optimize_*.txt optimize_*.json; do
            [ -e "$f" ] || continue
            case "$f" in *_scout.*) continue ;; esac
            base="${f%.*}"; ext="${f##*.}"
            mv -f "$f" "${base}_scout.${ext}"
            echo "scout: $f -> ${base}_scout.${ext}"
          done
          # restore the canonical files the optimiser clobbered in the workspace
          for f in optimize_tw.txt optimize_tw.json optimize_us.txt optimize_us.json; do
            git checkout -- "$f" 2>/dev/null || true
          done

      - name: Commit optimisation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # .lockbox_ledger.json must persist across runs or the reuse-refusal never fires (finding B1-08 / ADR .decisions/2026-07-17-audit-remediation.md).
          git add optimize_*.txt optimize_*.json universe_full_market.csv .lockbox_ledger.json 2>/dev/null || true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MSG="optimize(scout): $(date -u +%F) monthly scheduled run (calmar, non-canonical)"
          else
            MSG="optimize: $(date -u +%F) (${{ github.event.inputs.objective || 'calmar' }})"
          fi
          git commit -m "$MSG" || echo "no changes to commit"
          # Finding R7-01 (2026-08-03): the old loop had no post-loop failure check — if all 5
          # push attempts failed, this step still exited 0, so the job went GREEN while the
          # monthly (up to 350-min) optimisation results were never published to origin.
          # PUSHED flag + explicit exit 1 (pattern from daily.yml:260-273) makes an all-retries-
          # failed push a hard job failure instead of a silent no-op.
          PUSHED=false
          for i in 1 2 3 4 5; do
            if git push; then
              PUSHED=true
              break
            fi
            echo "push rejected (race), rebase + retry $i/5"
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep 5
          done
          if [ "${PUSHED}" = "false" ]; then
            echo "::error::Commit optimisation results: push failed after 5 attempts. This run's optimisation results were NOT published to origin."
            exit 1
          fi
