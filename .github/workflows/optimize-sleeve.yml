name: SmartStock Optimize Sleeve

# #4: disciplined Calmar/Sharpe/DD optimisation of the momentum sleeve (vol-targeting grid +
# DSR/PBO gates). HEAVY 15y x ~650-name compute → runs in the cloud, NOT on a local machine.
# Manual (workflow_dispatch) + a monthly refresh. The 15y OHLCV cache is persisted via a rolling
# actions/cache so the first run pays the ~350min download once and later runs reuse it.
on:
  workflow_dispatch:
    inputs:
      sleeve:
        description: 'Which sleeve to optimise'
        type: choice
        options: [both, tw, us]
        default: both
      objective:
        description: 'Objective function'
        type: choice
        options: [calmar, sharpe, maxdd_capped]
        default: calmar
      maxdd_cap:
        description: 'MaxDD cap (only used when objective=maxdd_capped), e.g. 0.35'
        default: '0.35'
      universe:
        description: 'draft (653 names) or full (whole keyless market — HEAVY first cache build)'
        type: choice
        options: [draft, full]
        default: draft
      tw_top_n:
        description: 'when universe=full, cap TW to the N most liquid by dollar-vol (blank = all)'
        default: '800'
      rigorous:
        description: 'use the嚴謹 walk-forward OOS selection (true terminal lockbox + embargo)'
        type: boolean
        default: true
  schedule:
    - cron: '43 6 7 * *'   # 7th of each month, 06:43 UTC — monthly re-optimise

permissions:
  contents: write
  issues: write

concurrency:
  group: smartstock-optimize
  cancel-in-progress: false

jobs:
  notify-failure:
    needs: [optimize]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="Workflow **${WF}** failed at $(date -u +%Y-%m-%dT%H:%MZ). Run: ${RUN_URL}"
          NUM=$(gh issue list --repo "$REPO" --state open --search "${WF} failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "🔴 ${WF} failed" --body "$BODY"
          fi

  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Persist the 15y OHLCV cache across runs: first run downloads (~350min), later runs reuse.
      - name: Restore 15y OHLCV cache
        uses: actions/cache@v4
        with:
          path: .cache/ohlcv_15y
          key: smartstock-ohlcv15y-${{ github.run_id }}
          restore-keys: |
            smartstock-ohlcv15y-

      # Phase 2: when universe=full, assemble the whole keyless market (TWSE+TPEx liquidity-capped
      # + the full US directory) into universe_full_market.csv. The 15y OHLC fetch for it is the
      # heavy part — names lacking long history are skipped by build_cache, so the effective
      # universe is "names with 15y history". draft = the curated 653-name CSV (default, fast).
      - name: Assemble full-market universe (universe=full only)
        if: ${{ github.event.inputs.universe == 'full' }}
        env:
          TW_TOP_N: ${{ github.event.inputs.tw_top_n || '800' }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${TW_TOP_N}" ]; then ARGS="--tw-top-n ${TW_TOP_N}"; fi
          python -X utf8 build_universe.py --out universe_full_market.csv $ARGS

      - name: Optimise sleeve(s)
        env:
          SLEEVE: ${{ github.event.inputs.sleeve || 'both' }}
          OBJ: ${{ github.event.inputs.objective || 'calmar' }}
          CAP: ${{ github.event.inputs.maxdd_cap || '0.35' }}
          UNIVERSE: ${{ github.event.inputs.universe || 'draft' }}
          RIGOROUS: ${{ github.event.inputs.rigorous }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$UNIVERSE" = "full" ]; then EXTRA="--csv universe_full_market.csv"; fi
          # default true on schedule/blank; only 'false' disables the嚴謹 path
          if [ "$RIGOROUS" != "false" ]; then EXTRA="$EXTRA --rigorous --embargo 252"; fi
          run_one () { python -X utf8 run_optimize.py --sleeve "$1" --objective "$OBJ" --maxdd-cap "$CAP" $EXTRA; }
          if [ "$SLEEVE" = "both" ]; then run_one tw; run_one us; else run_one "$SLEEVE"; fi

      - name: Commit optimisation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add optimize_*.txt optimize_*.json universe_full_market.csv 2>/dev/null || true
          git commit -m "optimize: $(date -u +%F) (${{ github.event.inputs.objective || 'calmar' }})" || echo "no changes to commit"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected (race), rebase + retry $i/5"
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep 5
          done
