name: SmartStock Monthly Sheet Backfill

# 日更只鏡像「當天」報告且 best-effort(continue-on-error)：被丟的排程 / SA quota 429 /
# gspread 暫掛 → 那天靜默漏進 Sheet。本 job 每月把「過去 40 天」重掃一次(idempotent
# upsert-by-date，永不重複)補洞。git JSON 仍是唯一真相源，Sheet 是鏡像。
# 用「尾端 40 天」而非 full --backfill：避開 Drive API 每分鐘寫入 quota(SA gotcha)。
# 3 號 13:33 UTC(~21:33 TW)：1/5/6/7/14 號已被佔，3 號空；奇數分(GitHub 免費版會丟 :00/:30)。
on:
  schedule:
    - cron: '33 13 3 * *'
  workflow_dispatch: {}      # Actions 頁手動觸發

permissions:
  contents: read

concurrency:
  group: smartstock-monthly-sheet-backfill
  cancel-in-progress: false

jobs:
  # Keyless 失敗告警(同 daily.yml)：硬失敗 → 用內建 GITHUB_TOKEN 開/更新一個去重 issue。
  notify-failure:
    needs: [backfill]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="Workflow **${WF}** failed at $(date -u +%Y-%m-%dT%H:%MZ). Run: ${RUN_URL}"
          NUM=$(gh issue list --repo "$REPO" --state open --search "${WF} failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "🔴 ${WF} failed" --body "$BODY"
          fi

  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        # Prefer the CI-frozen lock (reproducible) when present; fall back to the floating
        # requirements.txt until freeze-lock.yml has committed requirements.lock.
        run: |
          if [ -f requirements.lock ]; then pip install -r requirements.lock; else pip install -r requirements.txt; fi

      # Single process: sheets_sync --heal-missing reads the picks tab ONCE, computes which of
      # the trailing 40 days are absent from the Sheet, and re-syncs ONLY those (idempotent
      # upsert). Present days are skipped (no delete-storm), missing-day writes are paced + each
      # tab is 429-retried with backoff — so a backlog lands reliably and a healthy month is a
      # ~1-read no-op. This replaces the naive per-day loop that re-wrote all 40 days and
      # exhausted the Sheets 60-writes/min quota (observed run 28247281154: 11 days dropped).
      - name: Heal missing days in the Google Sheet (trailing 40d)
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEETS_ID: 1-pZRldRcTglT8rkBiQAnRdDigu4KnHdcT2WF-WfxmVM
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SA_JSON:-}" ]; then
            echo "::error::GOOGLE_SA_JSON secret not set — cannot sync the Sheet."; exit 1
          fi
          python sheets_sync.py --heal-missing --days 40
          echo "::notice::monthly heal-missing Sheet sync complete"
