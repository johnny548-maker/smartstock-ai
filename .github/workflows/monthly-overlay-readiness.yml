name: SmartStock Monthly Overlay Readiness

# Runs on the 1st of each month at 06:00 UTC — after enough daily snapshots have
# accrued in docs/data/_overlay_history/ to begin measuring forward returns.
# Also triggerable manually from the Actions tab for ad-hoc checks.
on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of month, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write   # to commit the readiness report + _overlay_history back

concurrency:
  group: smartstock-monthly-readiness
  cancel-in-progress: false

jobs:
  # Keyless failure alert (see daily.yml): dedup one open GitHub issue per workflow via GITHUB_TOKEN.
  notify-failure:
    needs: [overlay-readiness]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="Workflow **${WF}** failed at $(date -u +%Y-%m-%dT%H:%MZ). Run: ${RUN_URL}"
          NUM=$(gh issue list --repo "$REPO" --state open --search "${WF} failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "🔴 ${WF} failed" --body "$BODY"
          fi

  overlay-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run overlay readiness report
        run: python overlay_readiness.py

      - name: Commit readiness report and accrued overlay history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/overlay_readiness_*.md docs/data/_overlay_history
          git commit -m "overlay-readiness: $(date -u +%F)" || { echo "no changes to commit"; exit 0; }
          # Push with pull --rebase retry: a concurrent bot/local push (daily archive,
          # freeze-lock, 14:45 task) advances the remote and a bare push would 404 non-ff.
          # Finding R7-01 (2026-08-03): the old loop had no post-loop failure check — if all 5
          # push attempts failed, this step still exited 0 (the loop's own exit code, from the
          # last `sleep`, is 0), so the job went GREEN while the readiness report was never
          # published to origin. PUSHED flag + explicit exit 1 closes that gap.
          PUSHED=false
          for i in 1 2 3 4 5; do
            if git push; then
              PUSHED=true
              break
            fi
            echo "push rejected (attempt $i) — rebasing on remote and retrying"
            git pull --rebase origin main || exit 1
            sleep $((RANDOM % 5 + 1))
          done
          if [ "${PUSHED}" = "false" ]; then
            echo "::error::Commit readiness report: push failed after 5 attempts. Monthly overlay readiness report was NOT published to origin."
            exit 1
          fi
