name: SmartStock Monthly Base-Factor IC (A5 evidence)

# A5 re-check: per-base-factor cross-sectional rank-IC on the FULL opportunity universe
# (653 names, small/mid-caps included) — NOT the 65-name breadth basket whose all-negative
# IC the ADR flagged as a small-sample artifact. Reported-only evidence: a family below
# config.IC_MIN is a DEMOTION CANDIDATE that still needs human sign-off (flipping a base
# weight changes every pick). The daily run does NOT read this — it informs the HITL
# scorer-flip protocol in .decisions/2026-06-14-quant-rigor-architecture-upgrade.md.
#
# Own workflow (not a job in monthly-revalidation) so it is independently dispatchable for a
# one-shot answer without waiting behind the multi-hour backtest + robustness jobs. Runs the
# memory-frugal streaming run_factor_ic (the naive resident-frame version OOM-killed locally).
# 6th of month, 05:47 UTC — a day after revalidation, odd minute (GitHub drops :00/:30).
on:
  schedule:
    - cron: '47 5 6 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write          # Phase 4: open a HITL drift-review issue (never auto-applies a weight)

concurrency:
  group: smartstock-monthly-factor-ic
  cancel-in-progress: false

jobs:
  # Keyless failure alert (see daily.yml): dedup one open GitHub issue per workflow via GITHUB_TOKEN.
  notify-failure:
    needs: [factor-ic]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="Workflow **${WF}** failed at $(date -u +%Y-%m-%dT%H:%MZ). Run: ${RUN_URL}"
          NUM=$(gh issue list --repo "$REPO" --state open --search "${WF} failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "🔴 ${WF} failed" --body "$BODY"
          fi

  factor-ic:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # streaming single-pass over 653 names x 15y is the heavy tail
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # run_factor_ic streams from .cache/ohlcv_15y/ (memory-frugal) but a clean CI checkout
      # has NO cache (it is a local gitignored artifact) → load_fn returns None for every name
      # → n_used=0 silent-empty result (observed run 27521828937: exit 0, all rank_ic null).
      # Build the cache first (batch download, same data the revalidation backtest fetches) so
      # the streaming loader has frames to read.
      - name: Build 15y OHLCV cache
        run: python -X utf8 build_ohlcv_cache.py --csv universe_15y_draft.csv

      - name: Run full-universe base-factor IC
        run: |
          set -euo pipefail
          mkdir -p docs/data/_revalidation
          python -X utf8 run_factor_ic.py 15 --universe universe_15y_draft.csv \
            --out docs/data/_factor_ic_state.json \
            | tee "docs/data/_revalidation/$(date -u +%Y-%m)-factor-ic.txt"

      # Phase 4 HITL drift monitor — REPORTS only, NEVER auto-applies a weight. A factor crossing
      # the keep/demote boundary (rank_ic<0 AND edge<1.0 for a kept factor, or a demoted factor
      # recovering) writes docs/data/_factor_drift_alert.txt → the next step opens a review issue.
      - name: Factor-IC drift check (HITL)
        run: python -X utf8 check_factor_drift.py docs/data/_factor_ic_state.json

      - name: Open HITL drift-review issue if a factor crossed the boundary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -f docs/data/_factor_drift_alert.txt ] || { echo "no drift — no issue"; exit 0; }
          TITLE="🟡 Factor-IC drift — HITL review"
          BODY=$(printf 'Monthly factor-IC drift crossed the keep/demote boundary (run %s):\n\n```\n%s\n```\n\nREPORT-ONLY — do NOT flip any weight without the HITL scorer-flip protocol (evidence review + config change + golden re-baseline + ADR). See .decisions/2026-06-22-scorer-15y-revalidation.md.' "$RUN_URL" "$(cat docs/data/_factor_drift_alert.txt)")
          NUM=$(gh issue list --repo "$REPO" --state open --search "Factor-IC drift in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi

      - name: Commit factor-IC evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git add docs/data/_factor_ic_state.json docs/data/_revalidation
          git commit -m "factor-ic: $(date -u +%Y-%m)" || echo "no changes to commit"
          # Finding R7-04 (2026-08-03): this step used to do a single pull-rebase + bare push
          # with no retry loop at all — a push race in the (small but non-zero) window between
          # the pull-rebase and the push failed the whole job outright after the heaviest step
          # in the repo (up to 350 min streaming IC computation), instead of self-healing.
          # Ported the 5-attempt rebase-retry + PUSHED-flag pattern used by every other
          # committing workflow in this repo (daily.yml:260-273, optimize-sleeve.yml, etc.).
          PUSHED=false
          for i in 1 2 3 4 5; do
            if git push; then
              PUSHED=true
              break
            fi
            echo "push rejected (race), rebase + retry $i/5"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || git rebase --abort || true
            sleep 5
          done
          if [ "${PUSHED}" = "false" ]; then
            echo "::error::Commit factor-IC evidence: push failed after 5 attempts. This month's factor-IC evidence was NOT published to origin."
            exit 1
          fi
