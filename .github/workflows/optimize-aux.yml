name: SmartStock Optimize Aux (iter-2 chip/fundamental)

# Iteration-2: KEYLESS chip/fundamental factor extension (see
# .decisions/2026-06-22-chip-fundamental-extension). Backfills the date-parameterized TWSE RWD
# endpoints (T86 / BWIBBU_d / MI_MARGN — all keyless, no login) day-by-day into a rolling
# actions/cache, then runs run_aux_combo.py: Phase-0 IC screen → pre-registered 5-gate combo
# (n_trials=2). HEAVY (date-by-date fetch) → cloud only, INCREMENTAL across runs (the aux cache
# persists, already-cached dates are skipped) so a fortnightly cron extends the history.
on:
  workflow_dispatch:
    inputs:
      backfill_start:
        description: 'aux backfill start (YYYY-MM-DD). Incremental: cached dates are skipped.'
        default: '2012-01-02'
      backfill_end:
        description: 'aux backfill end (YYYY-MM-DD); blank = yesterday (UTC), the safe default'
        default: ''
      years:
        description: 'price history years to slice for the panel'
        default: '15'
  schedule:
    - cron: '17 5 14 * *'   # 14th of each month — extend the aux history + re-gate

permissions:
  contents: write
  issues: write

concurrency:
  # Joined to the OHLCV-cache writer group: the freshen step below WRITES the shared ohlcv15y cache,
  # so it must be mutually exclusive with warm-us-cache / optimize-sleeve (a concurrent warmer would
  # persist its pre-freshen snapshot under a newer key and resurrect files this run just deleted).
  group: smartstock-ohlcv-cache
  cancel-in-progress: false

jobs:
  notify-failure:
    needs: [optimize-aux]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="Workflow **${WF}** failed at $(date -u +%Y-%m-%dT%H:%MZ). Run: ${RUN_URL}"
          NUM=$(gh issue list --repo "$REPO" --state open --search "${WF} failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "🔴 ${WF} failed" --body "$BODY"
          fi

  optimize-aux:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          if [ -f requirements.lock ]; then pip install -r requirements.lock; else pip install -r requirements.txt; fi

      # 15y OHLCV cache (shared with optimize-sleeve / warm-us — same rolling key family)
      - name: Restore 15y OHLCV cache
        uses: actions/cache@v4
        with:
          path: .cache/ohlcv_15y
          key: smartstock-ohlcv15y-${{ github.run_id }}
          restore-keys: |
            smartstock-ohlcv15y-

      # Aux chip/fundamental raw panels — rolling cache, EXTENDED each run (incremental backfill)
      - name: Restore aux 15y cache
        uses: actions/cache@v4
        with:
          path: .cache/aux_15y
          key: smartstock-aux15y-${{ github.run_id }}
          restore-keys: |
            smartstock-aux15y-

      # Freshen a bounded slice of stale ohlcv15y files before the price panel is read (same rule as
      # optimize-sleeve): DELETE stale files → miss path re-fetches WHOLE history (never an append).
      # This run holds the smartstock-ohlcv-cache mutex, so no warmer can revive what it deletes.
      - name: Freshen stale OHLCV bars (delete + whole-history re-fetch)
        run: |
          set -euo pipefail
          CSV=universe_15y_draft.csv
          [ -f universe_full_market.csv ] && CSV=universe_full_market.csv
          python -X utf8 build_ohlcv_cache.py --stale-refresh 5 --limit 500 --csv "$CSV"

      - name: Backfill aux + IC screen + gate
        env:
          START: ${{ github.event.inputs.backfill_start || '2012-01-02' }}
          # blank on schedule (inputs context empty) → step computes YESTERDAY (UTC). Was hard-anchored
          # to 2026-06-20 → the monthly cron replayed a frozen END forever (asof=today but END frozen).
          # Yesterday, not today: cron 05:17 UTC = 13:17 Taipei, EARLIER than TWSE's ~14:00 publish, and
          # backfill's have-set is the UNION of panel dates — a partial-day fetch is cached as "done"
          # and never re-filled, so anchoring on today risks freezing an incomplete final day.
          END: ${{ github.event.inputs.backfill_end || '' }}
          YEARS: ${{ github.event.inputs.years || '15' }}
        run: |
          set -euo pipefail
          END="${END:-$(date -u -d '1 day ago' +%F)}"
          echo "aux backfill END=${END}"
          python -X utf8 run_aux_combo.py --csv universe_full_market.csv --years "$YEARS" \
                 --backfill "$START" "$END"

      # Finding OPS-1-01 (2026-08-03): optimize-aux.yml never received the 2026-07-07-incident
      # "canonical vs scout" fix that optimize-sleeve.yml got (see that workflow's header +
      # its own Reroute step) — its scheduled (non-human-blessed) monthly run committed
      # directly to the canonical optimize_tw_aux.{json,txt} via an unconditional git add,
      # and it already happened for real (HEAD content is a scheduled bot commit, not a
      # human workflow_dispatch run). Ported verbatim from optimize-sleeve.yml: on schedule,
      # rename the fresh outputs to *_scout.* and restore the canonical files from HEAD
      # before commit — a scout NEVER overwrites the canonical result; promote a scout by
      # re-running via workflow_dispatch.
      - name: Reroute scheduled outputs to scout files (never overwrite canonical)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          for f in optimize_tw_aux.txt optimize_tw_aux.json; do
            [ -e "$f" ] || continue
            case "$f" in *_scout.*) continue ;; esac
            base="${f%.*}"; ext="${f##*.}"
            mv -f "$f" "${base}_scout.${ext}"
            echo "scout: $f -> ${base}_scout.${ext}"
          done
          # restore the canonical files the aux pipeline clobbered in the workspace
          for f in optimize_tw_aux.txt optimize_tw_aux.json; do
            git checkout -- "$f" 2>/dev/null || true
          done

      - name: Commit aux results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # .lockbox_ledger.json must persist across runs or the reuse-refusal never fires (finding B1-08 / ADR .decisions/2026-07-17-audit-remediation.md); aux will share this same ledger shortly.
          git add optimize_tw_aux.txt optimize_tw_aux.json optimize_tw_aux_scout.txt optimize_tw_aux_scout.json .lockbox_ledger.json 2>/dev/null || true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MSG="optimize-aux(scout): $(date -u +%F) monthly scheduled run (iter-2 chip/fundamental IC+gate, non-canonical)"
          else
            MSG="optimize-aux: $(date -u +%F) (iter-2 chip/fundamental IC+gate)"
          fi
          git commit -m "$MSG" || echo "no changes"
          # Finding R7-01 (2026-08-03): PUSHED flag + explicit exit 1 (pattern from
          # daily.yml:260-273) — the old loop had no post-loop failure check, so an
          # all-retries-failed push still exited 0 and the job went GREEN with nothing published.
          PUSHED=false
          for i in 1 2 3 4 5; do
            if git push; then
              PUSHED=true
              break
            fi
            echo "push rejected (race), rebase + retry $i/5"
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep 5
          done
          if [ "${PUSHED}" = "false" ]; then
            echo "::error::Commit aux results: push failed after 5 attempts. This run's aux results were NOT published to origin."
            exit 1
          fi
